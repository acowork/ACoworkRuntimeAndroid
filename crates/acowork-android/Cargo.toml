[package]
name = "acowork-android"
description = "Android host-profile probe, capability derivation and execution-backend contract for the ACowork Node/Runtime port"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The platform-neutral rules. This is the crate's only non-serde dependency, and it
# is deliberately not the acowork monorepo: an Android port must be buildable without
# pulling a workspace that has no published tags (readiness assessment B3).
#
# `features = ["std"]` because Android *is* a std platform. The workspace dependency
# declares `default-features = false` so that a bare-metal port inherits the no_std
# configuration by default and has to opt in — the opposite default would silently
# make every embedded consumer carry `serde/std`.
acowork-platform-contract = { workspace = true, features = ["std"] }
async-trait.workspace = true
# Host-side integrity check for evidence artifacts: the device reports a sha256 of the
# bytes it wrote, and the file that lands in the Agent workspace must hash to the same value.
sha2 = "0.11"
# The companion to that check: the device can only hand bytes over a channel whose stdout is
# decoded as UTF-8 text, so every artifact arrives base64-encoded and has to be decoded here.
base64 = "0.22"
# Only `host::spawn::ProcessSpawnRunner` needs a runtime, and only because starting a
# process without blocking an async task needs an async pipe reader. Everything else in
# this crate is `Pin<Box<dyn Future>>`-clean and would compile without tokio; the feature
# list is the minimum for that one type. A port that supplies its own `SpawnRunner` (over
# adb, or a blocking thread) does not need this dependency at all.
tokio.workspace = true
# `std` because Android is a std platform and the models here are stored, logged and put on
# the wire as owned `String`s. The workspace default is `no_std`; opting in is deliberate.
serde = { workspace = true, features = ["std"] }
# The audit trail (§4.6.1) is stored as JSONL, and `host::audit::FileAuditSink` is library code,
# not test code, so this cannot stay a dev-dependency. Nothing else in the crate serialises to
# JSON: the contract layer owns the wire format, and the wire never carries a device record.
serde_json = { workspace = true, features = ["std"] }

# One call: `kill(-pgid, SIGKILL)`, to stop a timed-out command's whole process group
# instead of only its shell (`std` has no `killpg`). Target-gated to unix, and already in
# the build graph through tokio on every unix platform, so this adds no transitive weight.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true

[features]
# The device harness: an `adb`-backed `SpawnRunner` and `ProbeRunner` that run this crate's
# real types against a physical device from the machine attached to it.
#
# On by default because this crate is Android-only — it already carries `std` and `tokio`,
# so the harness costs nothing in the shipped build — and because a verification module whose
# tests only run when someone remembers a flag is a module that rots. `--no-default-features`
# yields the lean runtime build with no host-side transport in it.
default = ["device"]
device = []

# The harness example drives `host::adb`, which only exists with `device` on. Cargo builds
# examples regardless of features unless told otherwise, so without this gate
# `--no-default-features` — the very configuration the lean-build check exists to prove —
# fails for a reason that has nothing to do with what that check is measuring.
[[example]]
name = "device_probe"
required-features = ["device"]
