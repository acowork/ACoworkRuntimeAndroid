[package]
name = "acowork-android"
description = "Android host-profile probe, capability derivation and execution-backend contract for the ACowork Node/Runtime port"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The platform-neutral rules. This is the crate's only non-serde dependency, and it
# is deliberately not the acowork monorepo: an Android port must be buildable without
# pulling a workspace that has no published tags (readiness assessment B3).
#
# `features = ["std"]` because Android *is* a std platform. The workspace dependency
# declares `default-features = false` so that a bare-metal port inherits the no_std
# configuration by default and has to opt in — the opposite default would silently
# make every embedded consumer carry `serde/std`.
acowork-platform-contract = { workspace = true, features = ["std"] }
async-trait.workspace = true
# Only `host::spawn::ProcessSpawnRunner` needs a runtime, and only because starting a
# process without blocking an async task needs an async pipe reader. Everything else in
# this crate is `Pin<Box<dyn Future>>`-clean and would compile without tokio; the feature
# list is the minimum for that one type. A port that supplies its own `SpawnRunner` (over
# adb, or a blocking thread) does not need this dependency at all.
tokio.workspace = true
# `std` because Android is a std platform and the models here are stored, logged and put on
# the wire as owned `String`s. The workspace default is `no_std`; opting in is deliberate.
serde = { workspace = true, features = ["std"] }

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true

